[project]
name = "multi-camera-vehicle-re-identification-in-roundabouts"
version = "0.1.0"
description = "RoundaboutHD multi-camera vehicle annotation and tracking analysis"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.2,<2.4",
    "scipy>=1.13,<1.14",
    "matplotlib>=3.9,<3.10",
    "opencv-python>=4.10,<4.12",
    "openpyxl>=3.1,<4",
    "jupyterlab>=4.2,<5",
    "ipykernel>=6.29,<7",
]

[tool.uv]
package = false
cache-dir = ".cache/uv"
