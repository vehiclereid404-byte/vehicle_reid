stages:
  train:
    cmd: python src/models/train_model.py
    deps:
      - data/processed
      - src/models/train_model.py
    outs:
      - models:
          persist: true
    metrics:
      - reports/training_metrics.txt:
          cache: false
  eval:
    cmd: python src/models/predict_model.py
    deps:
      - data/processed
      - models
      - src/models/predict_model.py
    metrics:
      - reports/metrics.txt:
          cache: false
  process_data:
    cmd: python -m src.data.make_dataset
    deps:
      - data/raw/RoundaboutHD/RoundaboutHD_Reid_subset
      - data/raw/RoundaboutHD/Multi_CAM_Ground_Turth.txt
      - data/raw/RoundaboutHD/Vehicle_statistic.xlsx
      - data/raw/RoundaboutHD/imagesc001/SCT
      - data/raw/RoundaboutHD/imagesc002/SCT
      - data/raw/RoundaboutHD/imagesc003/SCT
      - data/raw/RoundaboutHD/imagesc004/SCT
      - src/data/make_dataset.py
      - src/data/load.py
    outs:
      - data/processed:
          persist: true
