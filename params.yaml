# Shared settings for every stage. Each stage edits only its own section.
# Swap a model by changing its `class` ("package.module:ClassName") and `args`.

raw_dir: data/raw/RoundaboutHD
cameras: [cam01, cam02, cam03, cam04]
seed: 42

prepare:
  frame_width: 3840
  frame_height: 2160
  n_frames: 9000
  match_iou: 0.5               # a Multi_CAM or labels_GT box belongs to an SCT box at IoU >= this
  class_iou: 0.7               # labels_GT box used to look up an SCT box's real class (issue D05)
  same_box_px: 1.0             # labels_test box equals an SCT box if all corners are within this (D17)
  single_cam_id_offset: 10000  # tracks with no Multi_CAM id: global_id = camera number * offset + track_id
  # ignore region per camera for tracking scoring (D23), built from the bottom edges of the gt track boxes;
  # a box is inside if its bottom-centre is (src/data/regions.py)
  region_cell_px: 8            # mask grid: one cell = 8 x 8 pixels
  region_close_px: 64          # morphological closing that joins neighbouring lanes
  region_margin_px: 16         # dilation around the gt footprint
  region_simplify_px: 8        # cv2.approxPolyDP tolerance for the polygon outline
  # Multi_CAM rows corrected before they are matched to SCT tracks (checked on the video).
  # Rows of `mc_id` on `cam` in frames from_frame..to_frame get `new_id`; new_id: null drops them.
  mc_corrections:
    - {cam: cam01, mc_id: 553, from_frame: 4075, to_frame: 4188, new_id: 554, issue: D06,
       reason: "boxes are SCT track 223, the white service pickup (554 on cam02/03); 553 is the silver Subaru, track 225"}
    - {cam: cam03, mc_id: 553, from_frame: 339, to_frame: 599, new_id: null, issue: D24,
       reason: "boxes are SCT track 29, a street sweeper; 553 is the silver Subaru (cam03 track 293)"}

det_split:                   # detection splits, frames and Hailo calibration lists (src/data/det_split.py, frames.py, calib.py)
  # Same 1-based frame window on every camera (the videos are synchronised); frames between windows are buffer
  # gaps and belong to no split. val first and test last, so val and test share no vehicle (trips last <= 6 min).
  windows:
    val: [1, 1350]             # 90 s
    train: [1801, 6750]        # 5.5 min
    test: [7201, 9000]         # 2 min: long enough for cross-camera trips (median first-to-last sighting 87 s)
  min_gap: 450                 # frames between windows (30 s): longer than 98.4% of gt tracks
  frame_step: 10               # detection frames: window frames with (frame - 1) % frame_step == 0
  jpeg_quality: 95             # extracted frames, about 1 MB each
  calib_frames: 1024           # detection calibration frames from train, the same number per camera, spread in time
  calib_crops: 1024            # ReID calibration crops (crops.csv split == train), per camera and crop-size quartile

reid_split:                  # ID-disjoint ReID split of the ReID crops (src/data/reid_split.py, uses `seed`)
  # Split along det_split.windows: val/test = the multi-camera vehicles of that window, with only that window's
  # crops; train = vehicles never seen in the val or test window (train window and gap crops).
  queries_per_cam: 1         # query crops per val/test vehicle and camera (cameras with 2+ crops)
  near_dup_bits: 24          # crops of two vehicles on one camera within this many of 256 dhash bits -> same split group
  link_window_frames: 1500   # possible missed Multi_CAM link: same make+model, unseen neighbouring camera, gap <= this

detection:
  run: baseline            # outputs/detections/<run>/
  model:
    class: null            # e.g. src.detection.yolov9:YOLOv9Detector
    args: {}

tracking:
  run: baseline            # outputs/tracks/<run>/
  input: gt                # detection run to track; "gt" = annotated boxes
  model:
    class: null            # e.g. src.tracking.bytetrack:ByteTracker
    args: {}

reid:
  run: baseline            # outputs/reid/<run>/
  input: gt                # tracking run to embed; "gt" = annotated tracks
  model:
    class: null            # e.g. src.reid.osnet:OSNet
    args: {}

matching:
  run: baseline            # outputs/matching/<run>/
  input: gt                # tracking + reid run to match
  model:
    class: null            # e.g. src.matching.appearance_time:AppearanceTimeMatcher
    args: {}

od:
  run: baseline            # outputs/od/<run>/
  input: gt                # matching run to count; "gt" = annotated cross-camera IDs
